[project]
name = "api-to-dwh"
version = "0.1.0"
description = "Containerized API connectors that land raw data into a ClickHouse DWH, orchestrated by Airflow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "connectors/*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["libs", "connectors"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
  "libs/dwh-common/src",
  "connectors/openmeteo/src",
  "connectors/coingecko/src",
  "connectors/nbk/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "defusedxml.*"]
ignore_missing_imports = true
