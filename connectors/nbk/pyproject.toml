[project]
name = "connector-nbk"
version = "0.1.0"
description = "National Bank of Kazakhstan official exchange rates -> ClickHouse raw.nbk"
requires-python = ">=3.13"
dependencies = [
  "dwh-common",
  "defusedxml>=0.7",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
]

[project.scripts]
connector-nbk = "connector_nbk.__main__:main"

[tool.uv.sources]
dwh-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector_nbk"]
