[project]
name = "connector-openmeteo"
version = "0.1.0"
description = "Open-Meteo daily weather -> ClickHouse raw.openmeteo"
requires-python = ">=3.13"
dependencies = [
  "dwh-common",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[project.scripts]
connector-openmeteo = "connector_openmeteo.__main__:main"

[tool.uv.sources]
dwh-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connector_openmeteo"]
