name: dbt image

# Builds the dbt runner image, checks the project parses inside it,
# and on main publishes it to GHCR next to the connector images.

on:
  pull_request:
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/dbt-runner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dbt/Dockerfile
          load: true
          tags: smoke/dbt-runner
          cache-from: type=gha,scope=dbt
          cache-to: type=gha,mode=max,scope=dbt

      # Parses models, sources, tests and macros without a database connection.
      - name: dbt parse
        run: docker run --rm smoke/dbt-runner parse --no-partial-parse

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dbt/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dbt
