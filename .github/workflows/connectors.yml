name: Connector images

# Builds one image per connector. Only connectors whose files changed are rebuilt;
# a change in the shared runtime (libs/, uv.lock, root pyproject) rebuilds all of them.
# Pull requests only build; pushes to main also publish to GHCR.

on:
  pull_request:
    paths:
      - "connectors/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/connectors.yml"
  push:
    branches: [main]
    paths:
      - "connectors/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/connectors.yml"
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every connector
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.detect.outputs.connectors }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed connectors
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(find connectors -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            selected="$all"
          else
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            if echo "$files" | grep -qE '^(libs/|uv\.lock$|pyproject\.toml$|\.github/workflows/connectors\.yml$)'; then
              selected="$all"
            else
              selected=$(echo "$files" | sed -nE 's#^connectors/([^/]+)/.*#\1#p' | sort -u)
            fi
          fi

          json=$(printf '%s\n' "$selected" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "connectors=$json" >> "$GITHUB_OUTPUT"
          echo "Selected: $json"

  build:
    needs: changes
    if: needs.changes.outputs.connectors != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.changes.outputs.connectors) }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' "connectors/${{ matrix.connector }}/pyproject.toml" | head -1)
          echo "image=ghcr.io/$owner/connector-${{ matrix.connector }}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          load: true
          tags: smoke/connector-${{ matrix.connector }}
          cache-from: type=gha,scope=${{ matrix.connector }}
          cache-to: type=gha,mode=max,scope=${{ matrix.connector }}

      # The image must start and parse its CLI before anything is published.
      - name: Smoke test
        run: docker run --rm smoke/connector-${{ matrix.connector }} --help

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: connectors/${{ matrix.connector }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.connector }}
