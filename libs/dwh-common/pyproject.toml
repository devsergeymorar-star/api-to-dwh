[project]
name = "dwh-common"
version = "0.1.0"
description = "Shared runtime for API connectors: HTTP retries, ClickHouse raw writer, CLI runner"
requires-python = ">=3.13"
dependencies = [
  "clickhouse-connect>=0.8",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwh_common"]
